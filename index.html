<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>انار | بازی‌های آموزشی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf8f6;
    --bg-2: #fbeef0;
    --surface: rgba(255, 255, 255, .78);
    --text: #2a1418;
    --muted: #8a6a70;
    --accent: #c4122f;
    --accent-2: #e8475f;
    --leaf: #4f7a4a;
    --border: rgba(196, 18, 47, .12);
    --shadow: 0 14px 34px rgba(125, 10, 30, .12);
    --blob-1: rgba(196, 18, 47, .18);
    --blob-2: rgba(79, 122, 74, .14);
  }
  [data-theme="dark"] {
    --bg: #120809;
    --bg-2: #1c0c10;
    --surface: rgba(38, 18, 24, .72);
    --text: #f7ecee;
    --muted: #b99aa1;
    --accent: #ff3b5c;
    --accent-2: #ff8fa0;
    --leaf: #8fbf7f;
    --border: rgba(255, 59, 92, .18);
    --shadow: 0 14px 40px rgba(0, 0, 0, .55);
    --blob-1: rgba(255, 59, 92, .22);
    --blob-2: rgba(143, 191, 127, .12);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Vazirmatn", Tahoma, system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg), var(--bg-2));
    min-height: 100vh;
    overflow-x: hidden;
    transition: background .6s ease, color .4s ease;
    display: flex;
    flex-direction: column;
  }

  /* ---------- پس‌زمینه‌ی متحرک ---------- */
  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    z-index: -1;
    pointer-events: none;
    animation: drift 18s ease-in-out infinite alternate;
  }
  .blob-1 { width: 420px; height: 420px; background: var(--blob-1); top: -120px; right: -100px; }
  .blob-2 { width: 380px; height: 380px; background: var(--blob-2); bottom: -120px; left: -80px; animation-duration: 22s; }
  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(40px, 30px) scale(1.12); }
  }

  .seeds { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
  .seed {
    position: absolute;
    bottom: -40px;
    width: 14px; height: 18px;
    background: radial-gradient(circle at 35% 30%, var(--accent-2), var(--accent));
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity: .35;
    animation: rise linear infinite;
  }
  @keyframes rise {
    from { transform: translateY(0) rotate(0deg); }
    to   { transform: translateY(-110vh) rotate(360deg); }
  }

  /* ---------- سربرگ ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
    padding: 22px 6vw 10px;
    animation: fadeDown .8s ease both;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .logo {
    height: 78px; width: auto;
    filter: drop-shadow(0 8px 14px rgba(196, 18, 47, .25));
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-8px) rotate(2deg); }
  }
  .brand h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--accent));
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shimmer 5s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% center; } }
  .brand p { margin: 4px 0 0; font-size: .92rem; color: var(--muted); }

  #themeBtn {
    position: relative;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 10px 20px;
    cursor: pointer;
    font-family: inherit;
    font-size: .95rem;
    font-weight: 600;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    transition: transform .2s, box-shadow .2s;
  }
  #themeBtn:hover { transform: translateY(-2px) scale(1.04); }
  #themeBtn:active { transform: scale(.96); }
  #themeBtn .ico { display: inline-block; transition: transform .6s cubic-bezier(.4,1.6,.5,1); }
  #themeBtn.spin .ico { transform: rotate(360deg); }

  /* ---------- نوار جستجو ---------- */
  .toolbar {
    padding: 14px 6vw 6px;
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    animation: fadeDown .8s .15s ease both;
  }
  .search-wrap { position: relative; flex: 1; min-width: 240px; max-width: 440px; }
  .search-wrap::before {
    content: "⌕";
    position: absolute;
    right: 16px; top: 50%;
    transform: translateY(-52%);
    font-size: 1.3rem;
    color: var(--muted);
    pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 13px 46px 13px 18px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    outline: none;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    transition: border-color .25s, box-shadow .25s, transform .25s;
  }
  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(196, 18, 47, .15), var(--shadow);
    transform: translateY(-1px);
  }
  #count {
    color: var(--muted);
    font-size: .95rem;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
  }

  /* ---------- شبکه‌ی بازی‌ها ---------- */
  main { padding: 18px 6vw 40px; flex: 1; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 22px;
  }

  .card {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 26px 22px 20px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
    text-decoration: none;
    color: var(--text);
    display: flex;
    flex-direction: column;
    gap: 14px;
    overflow: hidden;
    opacity: 0;
    animation: cardIn .6s cubic-bezier(.2,.8,.2,1) forwards;
    transition: transform .3s cubic-bezier(.2,.8,.2,1), border-color .3s, box-shadow .3s;
    transform-style: preserve-3d;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(.96); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card::before {
    content: "";
    position: absolute;
    inset: 0 0 auto 0;
    height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transform: scaleX(0);
    transform-origin: right;
    transition: transform .5s ease;
  }
  .card::after {
    content: "";
    position: absolute;
    top: -50%; left: -60%;
    width: 40%; height: 200%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent);
    transform: rotate(20deg);
    transition: left .7s ease;
    pointer-events: none;
  }
  .card:hover {
    transform: translateY(-8px);
    border-color: var(--accent);
    box-shadow: 0 22px 44px rgba(196, 18, 47, .22);
  }
  .card:hover::before { transform: scaleX(1); transform-origin: left; }
  .card:hover::after { left: 130%; }

  .icon {
    width: 58px; height: 58px;
    border-radius: 18px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-size: 1.5rem;
    font-weight: 800;
    box-shadow: 0 8px 18px rgba(196, 18, 47, .3);
    transition: transform .4s cubic-bezier(.4,1.6,.5,1);
  }
  .card:hover .icon { transform: rotate(-8deg) scale(1.1); }
  .card h3 {
    margin: 0;
    font-size: 1.12rem;
    line-height: 1.7;
    word-break: break-word;
  }
  .play {
    margin-top: auto;
    font-size: .92rem;
    color: var(--accent);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .play span { display: inline-block; transition: transform .3s; }
  .card:hover .play span { transform: translateX(-6px); }

  .empty, .loading {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--muted);
    padding: 70px 10px;
    font-size: 1.05rem;
    animation: fadeDown .6s ease both;
  }
  .loader {
    width: 44px; height: 44px;
    margin: 0 auto 16px;
    border-radius: 50%;
    border: 4px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    text-align: center;
    padding: 18px;
    color: var(--muted);
    font-size: .88rem;
    border-top: 1px solid var(--border);
    backdrop-filter: blur(6px);
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .logo { height: 56px; }
    .brand h1 { font-size: 1.5rem; }
    .brand p { font-size: .82rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>

    <div>
      <h1>انار</h1>
      <p>بازی‌های تعاملی آموزشی در همه‌ی درس‌ها</p>
    </div>
  </div>
  <button id="themeBtn" type="button"><span class="ico">🌙</span> <span class="label">تم تیره</span></button>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <input id="search" type="search" placeholder="جستجوی بازی..." autocomplete="off">
  </div>
  <span id="count"></span>
</div>

<main>
  <div class="grid" id="grid">
    <div class="loading"><div class="loader"></div>در حال بارگذاری بازی‌ها...</div>
  </div>
</main>

<footer>© انار — همه‌ی حقوق محفوظ است</footer>

<script>
  /* ========= تنظیمات ========= */
  const GAME_DIR = 'game';
  const FALLBACK_GAMES = [];   // اگر خواندن خودکار نشد، نام فایل‌ها را اینجا بنویسید: ['math-1.html']

  /* ========= دانه‌های متحرک پس‌زمینه ========= */
  (function makeSeeds() {
    const box = document.getElementById('seeds');
    const n = window.innerWidth < 600 ? 12 : 24;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('i');
      s.className = 'seed';
      const size = 10 + Math.random() * 12;
      s.style.width = size + 'px';
      s.style.height = size * 1.3 + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.animationDuration = (14 + Math.random() * 16) + 's';
      s.style.animationDelay = (-Math.random() * 20) + 's';
      box.appendChild(s);
    }
  })();

  /* ========= تم ========= */
  const root = document.documentElement;
  const themeBtn = document.getElementById('themeBtn');
  const themeIco = themeBtn.querySelector('.ico');
  const themeLabel = themeBtn.querySelector('.label');

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    themeIco.textContent = theme === 'dark' ? '☀️' : '🌙';
    themeLabel.textContent = theme === 'dark' ? 'تم روشن' : 'تم تیره';
    try { localStorage.setItem('anar-theme', theme); } catch (e) {}
  }

  let savedTheme = null;
  try { savedTheme = localStorage.getItem('anar-theme'); } catch (e) {}
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(savedTheme || (prefersDark ? 'dark' : 'light'));

  themeBtn.addEventListener('click', () => {
    themeBtn.classList.remove('spin');
    void themeBtn.offsetWidth;
    themeBtn.classList.add('spin');
    applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* ========= شناسایی مخزن گیت‌هاب ========= */
  function repoInfo() {
    const host = location.hostname;
    if (!host.endsWith('.github.io')) return {};
    const owner = host.split('.')[0];
    const seg = location.pathname.split('/').filter(Boolean)[0];
    const repo = seg || `${owner}.github.io`;
    return { owner, repo };
  }

  /* ========= فهرست بازی‌ها ========= */
  async function loadGames() {
    const { owner, repo } = repoInfo();

    // روش ۱: خواندن پوشه‌ی game از API گیت‌هاب
    try {
      if (!owner) throw new Error('not github pages');
      const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${GAME_DIR}`);
      if (!res.ok) throw new Error(res.status);
      const items = await res.json();
      return items
        .filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.html'))
        .map(f => f.name)
        .sort((a, b) => a.localeCompare(b, 'fa'));
    } catch (e) {}

    // روش ۲: فایل games.json داخل پوشه‌ی game
    try {
      const res = await fetch(`${GAME_DIR}/games.json`);
      if (res.ok) return await res.json();
    } catch (e) {}

    // روش ۳: فهرست دستی
    return FALLBACK_GAMES;
  }

  function prettyName(file) {
    let name = file.replace(/\.html$/i, '');
    try { name = decodeURIComponent(name); } catch (e) {}
    return name.replace(/[-_]+/g, ' ').trim();
  }

  /* ========= ساخت کارت‌ها ========= */
  let allGames = [];
  const grid = document.getElementById('grid');
  const search = document.getElementById('search');
  const count = document.getElementById('count');

  function render(filter = '') {
    const q = filter.trim().toLowerCase();
    const list = allGames.filter(f => prettyName(f).toLowerCase().includes(q));

    count.textContent = `${list.length} بازی`;

    if (allGames.length === 0) {
      grid.innerHTML = `<div class="empty">هنوز بازی‌ای در پوشه‌ی <b>${GAME_DIR}</b> پیدا نشد.</div>`;
      return;
    }
    if (list.length === 0) {
      grid.innerHTML = `<div class="empty">بازی‌ای با این نام پیدا نشد.</div>`;
      return;
    }

    grid.innerHTML = '';
    list.forEach((file, i) => {
      const name = prettyName(file);
      const a = document.createElement('a');
      a.className = 'card';
      a.href = `${GAME_DIR}/${encodeURIComponent(file)}`;
      a.style.animationDelay = `${Math.min(i, 20) * 0.06}s`;
      a.innerHTML = `
        <div class="icon"></div>
        <h3></h3>
        <div class="play">شروع بازی <span>←</span></div>`;
      a.querySelector('.icon').textContent = name.charAt(0) || '🎮';
      a.querySelector('h3').textContent = name;
      grid.appendChild(a);
    });
  }

  search.addEventListener('input', e => render(e.target.value));

  loadGames().then(files => {
    allGames = files;
    render();
  });
</script>

</body>
</html>
