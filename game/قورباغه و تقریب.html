<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قورباغه و تقریب - پایه سوم</title>
<style>
:root{--bg:#F3F5FF;--navy:#1E1A80;--ink:#1E1A80;--pad:#1BAA4B;--pad2:#128A3B;--sun:#FFC83D;--orange:#F28C0F;--coral:#C2410C;--mid:#5B5FA8;--card:#FFFFFF}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,"Segoe UI",Arial,sans-serif;display:flex;justify-content:center;padding:16px;line-height:1.8}
.wrap{width:100%;max-width:600px;display:flex;flex-direction:column;gap:12px}
h1{text-align:center;margin:4px 0;font-size:1.5rem;color:var(--navy);padding-left:70px}
.top{display:flex;justify-content:space-between;background:var(--card);border-radius:16px;padding:10px 14px;font-weight:bold;color:var(--navy);border-bottom:4px solid var(--orange)}
.bar{height:14px;background:#fff;border-radius:99px;overflow:hidden;border:2px solid var(--navy)}
.bar div{height:100%;width:0;background:var(--sun);transition:width .4s}
.card{background:var(--card);border-radius:22px;padding:16px 12px;text-align:center}
.q{font-size:1.1rem;margin:0}
.q b{color:var(--navy);background:var(--sun);padding:0 8px;border-radius:10px;font-size:1.4rem}
.hint{font-size:.9rem;color:var(--mid);margin:4px 0 0}
svg{width:100%;height:auto;display:block;margin:6px 0}
.pad{cursor:pointer}
.pad circle{fill:var(--pad);stroke:var(--pad2);stroke-width:4}
.pad.ok circle{fill:var(--sun)}
.pad.bad circle{fill:var(--coral)}
.pad text{font-size:24px}
#dragArea{min-height:60px}
.chip{display:inline-block;background:var(--coral);color:#fff;font-size:1.6rem;font-weight:bold;padding:6px 22px;border-radius:14px;cursor:grab;touch-action:none;user-select:none;position:relative}
.fb{min-height:4.5em;font-weight:bold;margin-top:6px}
.fb.good{color:var(--pad2)}
.fb.bad{color:var(--coral)}
.ex{font-weight:normal;font-size:.95rem;margin-top:4px}
button{font:inherit;font-weight:bold;border:0;border-radius:999px;padding:10px 24px;background:var(--navy);color:#fff;cursor:pointer;margin:4px}
.hidden{display:none!important}
.end h2{font-size:1.4rem}
.stars{font-size:2rem;color:var(--sun)}
.hdr{background:var(--navy);color:#fff;border-radius:22px;padding:16px 18px;display:flex;align-items:center;gap:14px}
.hdr-logo{background:#fff;border-radius:18px;width:84px;height:84px;padding:8px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.hdr-logo img{width:100%;height:100%;object-fit:contain;border-radius:8px}
.hdr-text{flex:1;text-align:right}
.hdr-title{margin:0;color:var(--orange);font-size:1.6rem;font-weight:900;line-height:1.4}
.hdr-sub{margin:0;color:#C9CCEF;font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="hdr">
    <div class="hdr-text">
      <h1 class="hdr-title">قورباغه و تقریب</h1>
      <p class="hdr-sub">بازی ریاضی پایه سوم · مجتمع آموزشی ترنج</p>

  <div class="top">
    <span>امتیاز: <span id="score">۰</span></span>
    <span>چالش <span id="cnum">۱</span> از ۱۰</span>
  </div>
  <div class="bar"><div id="prog"></div></div>

  <div class="card" id="game">
    <p class="q" id="q"></p>
    <p class="hint" id="hint"></p>
    <div id="dragArea"></div>
    <svg id="line" viewBox="0 0 600 240" role="group" aria-label="محور اعداد"></svg>
    <p class="fb" id="fb" aria-live="polite"></p>
    <button id="next" class="hidden">چالش بعدی</button>
  </div>

  <div class="card end hidden" id="end">
    <h2>تمام شد! 🎉</h2>
    <div class="stars" id="stars"></div>
    <p id="final"></p>
    <button id="restart">بازی دوباره</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const fa = n => String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);

// ده چالش با سختی تدریجی: اول دهگان با کلیک، سپس با کشیدن، و در پایان صدگان
const CH = [
  {n:23,  mode:"click"},
  {n:38,  mode:"drag"},
  {n:61,  mode:"click"},
  {n:74,  mode:"drag"},
  {n:96,  mode:"click"},
  {n:217, mode:"click"},
  {n:384, mode:"drag"},
  {n:452, mode:"click"},
  {n:638, mode:"drag"},
  {n:879, mode:"click"}
];

let idx = 0, score = 0, attempts = 0, locked = false, cur = {};
let tx = 0, ty = 0, drag = null;

function load(){
  const c = CH[idx];
  const step = c.n < 100 ? 10 : 100;
  const lo = Math.floor(c.n / step) * step;
  const hi = lo + step;
  const mid = lo + step / 2;
  cur = {n:c.n, mode:c.mode, step, lo, hi, mid, ans: (c.n - lo < step / 2) ? lo : hi};
  attempts = 0; locked = false; tx = ty = 0;

  $("prog").style.width = (idx / CH.length * 100) + "%";
  $("cnum").textContent = fa(idx + 1);
  $("score").textContent = fa(score);
  $("q").innerHTML = `عدد <b>${fa(cur.n)}</b> را به نزدیک‌ترین ${step === 10 ? "دهگان" : "صدگان"} تقریب بزن`;
  $("hint").textContent = c.mode === "drag"
    ? "عدد را بگیر و روی نزدیک‌ترین قورباغه بکش"
    : "روی نزدیک‌ترین قورباغه کلیک کن";
  $("dragArea").innerHTML = c.mode === "drag" ? `<span class="chip" id="chip">${fa(cur.n)}</span>` : "";
  if (c.mode === "drag") bindChip();
  $("fb").textContent = "";
  $("fb").className = "fb";
  $("next").classList.add("hidden");
  draw();
}

function draw(){
  const {lo, hi, mid, n, step} = cur;
  const L = 60, R = 540, Y = 110;
  const x = v => L + (v - lo) / step * (R - L);
  let g = `<line x1="${L}" y1="${Y}" x2="${R}" y2="${Y}" stroke="var(--ink)" stroke-width="4" stroke-linecap="round"/>`;
  for (let k = 1; k < 10; k++){
    const v = lo + k * step / 10;
    g += `<line x1="${x(v)}" y1="${Y-8}" x2="${x(v)}" y2="${Y+8}" stroke="var(--ink)" stroke-width="2"/>`;
  }
  g += `<line x1="${x(mid)}" y1="${Y-20}" x2="${x(mid)}" y2="${Y+100}" stroke="var(--mid)" stroke-width="2" stroke-dasharray="6 6"/>`;
  g += `<text x="${x(mid)}" y="${Y+125}" text-anchor="middle" fill="var(--mid)" font-size="16">وسط: ${fa(mid)}</text>`;
  g += `<rect x="${x(n)-40}" y="${Y-72}" width="80" height="36" rx="10" fill="var(--coral)"/>`;
  g += `<text x="${x(n)}" y="${Y-47}" text-anchor="middle" fill="#fff" font-size="20" font-weight="bold">${fa(n)}</text>`;
  g += `<line x1="${x(n)}" y1="${Y-36}" x2="${x(n)}" y2="${Y-10}" stroke="var(--coral)" stroke-width="3"/>`;
  g += `<circle cx="${x(n)}" cy="${Y}" r="7" fill="var(--coral)"/>`;
  for (const v of [lo, hi]){
    g += `<g class="pad" data-v="${v}" role="button" aria-label="${fa(v)}">
            <circle cx="${x(v)}" cy="${Y}" r="30"/>
            <text x="${x(v)}" y="${Y+8}" text-anchor="middle">🐸</text>
          </g>
          <text x="${x(v)}" y="${Y+60}" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--ink)">${fa(v)}</text>`;
  }
  $("line").innerHTML = g;
}

function padAt(px, py){
  for (const p of document.querySelectorAll("#line .pad")){
    const r = p.getBoundingClientRect(), m = 25;
    if (px >= r.left - m && px <= r.right + m && py >= r.top - m && py <= r.bottom + m) return +p.dataset.v;
  }
  return null;
}

function bindChip(){
  const chip = $("chip");
  chip.addEventListener("pointerdown", e => {
    if (locked) return;
    drag = {x: e.clientX - tx, y: e.clientY - ty};
    chip.setPointerCapture(e.pointerId);
  });
  chip.addEventListener("pointermove", e => {
    if (!drag) return;
    tx = e.clientX - drag.x;
    ty = e.clientY - drag.y;
    chip.style.transform = `translate(${tx}px, ${ty}px)`;
  });
  chip.addEventListener("pointerup", e => {
    if (!drag) return;
    drag = null;
    const v = padAt(e.clientX, e.clientY);
    if (v !== null) pick(v); else resetChip();
  });
  chip.addEventListener("pointercancel", () => { drag = null; resetChip(); });
}

function resetChip(){
  tx = ty = 0;
  const c = $("chip");
  if (c) c.style.transform = "";
}

function pick(v){
  if (locked) return;
  attempts++;
  const ok = v === cur.ans;
  const pads = document.querySelectorAll("#line .pad");
  const fb = $("fb");
  const ex = `عدد ${fa(cur.n)} بین ${fa(cur.lo)} و ${fa(cur.hi)} است و وسط آن ${fa(cur.mid)} است. چون ${fa(cur.n)} ${cur.n > cur.mid ? "از وسط بزرگ‌تر" : "از وسط کوچک‌تر"} است، به ${fa(cur.ans)} گرد می‌شود.`;

  if (ok){
    const pts = attempts === 1 ? 10 : 5;
    score += pts;
    $("score").textContent = fa(score);
    pads.forEach(p => { if (+p.dataset.v === v) p.classList.add("ok"); });
    locked = true;
    fb.className = "fb good";
    fb.innerHTML = `آفرین! +${fa(pts)} امتیاز 🎉<div class="ex">${ex}</div>`;
    showNext();
  } else if (attempts === 1){
    pads.forEach(p => { if (+p.dataset.v === v) p.classList.add("bad"); });
    resetChip();
    fb.className = "fb bad";
    fb.innerHTML = `هنوز درست نیست. یک بار دیگر فکر کن! 💡<div class="ex">راهنمایی: عدد را با نقطه‌ی وسط مقایسه کن.</div>`;
  } else {
    pads.forEach(p => {
      const pv = +p.dataset.v;
      if (pv === cur.ans) p.classList.add("ok");
      else if (pv === v) p.classList.add("bad");
    });
    locked = true;
    resetChip();
    fb.className = "fb bad";
    fb.innerHTML = `جواب درست: ${fa(cur.ans)} 💡<div class="ex">${ex}</div>`;
    showNext();
  }
}

function showNext(){
  $("next").textContent = idx === CH.length - 1 ? "پایان بازی" : "چالش بعدی";
  $("next").classList.remove("hidden");
}

function showEnd(){
  $("game").classList.add("hidden");
  $("prog").style.width = "100%";
  $("end").classList.remove("hidden");
  const stars = score >= 85 ? 3 : score >= 50 ? 2 : 1;
  $("stars").textContent = "★".repeat(stars) + "☆".repeat(3 - stars);
  const msg = stars === 3 ? "عالی بود! تو تقریب زدن را خوب یاد گرفتی." :
              stars === 2 ? "خوب بود! یک بار دیگر بازی کن تا مهارتت بیشتر شود." :
                            "خوب تلاش کردی! بازی را دوباره انجام بده تا قورباغه را راحت‌تر به عدد نزدیک‌تر برسانی.";
  $("final").textContent = `امتیاز تو: ${fa(score)} از ${fa(100)}. ${msg}`;
}

$("line").addEventListener("click", e => {
  const g = e.target.closest(".pad");
  if (g) pick(+g.dataset.v);
});

$("next").addEventListener("click", () => {
  idx++;
  if (idx >= CH.length) showEnd(); else load();
});

$("restart").addEventListener("click", () => {
  idx = 0; score = 0;
  $("end").classList.add("hidden");
  $("game").classList.remove("hidden");
  load();
});

load();
</script>
</body>
</html>
