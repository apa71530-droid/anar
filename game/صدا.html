<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صدا | بازی انار</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 16px;
    font-family: "Vazirmatn", Tahoma, sans-serif; color: #2d3436;
    background: linear-gradient(135deg, #ffe6f5, #e0f7ff 50%, #fff5e1);
    display: flex; flex-direction: column; align-items: center; overflow-x: hidden;
  }
  header { width: 100%; max-width: 680px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { height: 60px; animation: bob 3s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px) rotate(3deg); } }
  .home { text-decoration: none; color: #2d3436; background: #fff; padding: 9px 16px; border-radius: 999px; font-weight: 700; box-shadow: 0 4px 0 #e0d6d6; }
  h1 { margin: 14px 0 4px; font-size: 2rem; color: #ff9ff3; font-weight: 900; text-shadow: 0 3px 0 #f0b4e8; }
  .sub { margin: 0 0 16px; color: #636e72; text-align: center; }
  .panel { width: 100%; max-width: 680px; background: #fff; border-radius: 28px; padding: 24px; box-shadow: 0 10px 0 rgba(0,0,0,.06); text-align: center; }
  .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; margin-bottom: 10px; }
  .pill { background: #feca57; padding: 4px 14px; border-radius: 999px; }

  .vib-box { height: 170px; display: flex; align-items: center; justify-content: center; }
  .vib {
    width: 130px; height: 130px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #ffd6f0 60%, #ff9ff3);
    display: grid; place-items: center; font-size: 56px;
    box-shadow: 0 10px 0 rgba(0,0,0,.08);
  }
  .vib.on { animation: vib var(--dur, .3s) ease-in-out infinite alternate; }
  @keyframes vib { from { transform: scale(1); } to { transform: scale(var(--amp, 1.2)); } }

  .btn {
    font-family: inherit; font-size: 1.2rem; font-weight: 900; border: none; border-radius: 22px;
    padding: 14px 30px; background: #54a0ff; color: #fff; cursor: pointer;
    box-shadow: 0 7px 0 #3778d6; transition: transform .1s, box-shadow .1s;
  }
  .btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #3778d6; }
  .btn.small { background: #1dd1a1; box-shadow: 0 6px 0 #0fa77f; }
  .btn.small:active { box-shadow: 0 2px 0 #0fa77f; }

  .q { margin-top: 22px; }
  .q h3 { margin: 0 0 10px; font-size: 1.15rem; }
  .opts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .opt {
    font-family: inherit; font-size: 1.1rem; font-weight: 700; border: 3px solid transparent;
    border-radius: 18px; padding: 12px 20px; background: #f1f2f6; color: #2d3436; cursor: pointer;
    transition: transform .15s, background .3s, border-color .3s;
  }
  .opt:hover { transform: translateY(-2px); }
  .opt.picked { border-color: #54a0ff; background: #e0f0ff; }
  .opt.right { background: #1dd1a1; color: #fff; }
  .opt.wrong { background: #ff9f9f; color: #fff; }

  .msg { min-height: 3em; margin: 18px 0 10px; font-weight: 700; font-size: 1.05rem; line-height: 1.8; }
  .msg.good { color: #10ac84; }
  .msg.bad { color: #ee5253; }
  .end h2 { font-size: 1.6rem; margin: 10px 0 0; }
  .stars { font-size: 3rem; letter-spacing: 6px; }
  .piece { position: fixed; top: -20px; width: 10px; height: 14px; border-radius: 3px; animation: fall 1.8s linear forwards; z-index: 9; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>

      const p = document.createElement('span');
      p.className = 'piece';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = Math.random() * 0.3 + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 2200);
    }
  }

  function newRound() {
    cur = {
      pitch: Math.random() < 0.5 ? 'high' : 'low',
      loud:  Math.random() < 0.5 ? 'loud' : 'soft'
    };
    ans = {};
    msg.className = 'msg';
    msg.textContent = 'صدا را بشنو، سپس دو سؤال را جواب بده.';
    nextBtn.hidden = true;
    document.querySelectorAll('.opt').forEach(b => b.classList.remove('picked', 'right', 'wrong'));
    $('prog').textContent = `دور ${round + 1} از ${TOTAL}`;
    $('score').textContent = `⭐ امتیاز: ${score}`;
  }

  function vibrate() {
    // صدای زیر = ارتعاش سریع‌تر، صدای بلند = ارتعاش دامنه‌ی بیشتر
    vib.style.setProperty('--dur', cur.pitch === 'high' ? '0.12s' : '0.45s');
    vib.style.setProperty('--amp', cur.loud === 'loud' ? '1.35' : '1.08');
    vib.classList.remove('on');
    void vib.offsetWidth;
    vib.classList.add('on');
    clearTimeout(vibTimer);
    vibTimer = setTimeout(() => vib.classList.remove('on'), 1300);
  }

  function playTone() {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
    const t = audio.currentTime;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = 'sine';
    osc.frequency.value = FREQ[cur.pitch];
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(AMP[cur.loud], t + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.2);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start(t);
    osc.stop(t + 1.25);
    vibrate();
  }

  $('listen').addEventListener('click', playTone);

  document.querySelectorAll('.opt').forEach(btn => {
    btn.addEventListener('click', () => {
      const g = btn.dataset.g;
      if (ans[g]) return;
      ans[g] = btn.dataset.v;
      btn.classList.add('picked');
      if (ans.pitch && ans.loud) finishRound();
    });
  });

  function finishRound() {
    const correctPitch = cur.pitch, correctLoud = cur.loud;
    document.querySelectorAll('.opt').forEach(b => {
      const g = b.dataset.g, v = b.dataset.v;
      const correct = g === 'pitch' ? correctPitch : correctLoud;
      if (v === correct) b.classList.add('right');
      else if (b.classList.contains('picked')) b.classList.add('wrong');
    });

    let got = 0;
    if (ans.pitch === correctPitch) got++;
    if (ans.loud === correctLoud) got++;
    score += got;

    const pitchFa = correctPitch === 'high' ? 'زیر' : 'بم';
    const loudFa  = correctLoud === 'loud' ? 'بلند' : 'آهسته';
    msg.className = got === 2 ? 'msg good' : 'msg bad';
    msg.innerHTML = (got === 2 ? 'آفرین! دو جواب درست 🎉' : `این صدا ${pitchFa} و ${loudFa} بود.`) +
      '<br>صدای زیر ارتعاش سریع‌تر دارد و صدای بلند ارتعاش بزرگ‌تری.';
    if (got === 2) burst();

    nextBtn.hidden = false;
    $('score').textContent = `⭐ امتیاز: ${score}`;
  }

  nextBtn.addEventListener('click', () => {
    round++;
    if (round >= TOTAL) return finish();
    newRound();
  });

  function finish() {
    $('stage').hidden = true;
    const max = TOTAL * 2;
    const ratio = score / max;
    const n = ratio >= 0.85 ? 3 : ratio >= 0.5 ? 2 : 1;
    const end = $('end');
    end.hidden = false;
    end.innerHTML = `
      <div class="stars">${'⭐'.repeat(n)}${'☆'.repeat(3 - n)}</div>
      <h2>امتیاز تو: ${score} از ${max}</h2>
      <button class="btn" id="again">بازی دوباره 🔁</button>`;
    $('again').onclick = () => {
      end.hidden = true;
      $('stage').hidden = false;
      round = 0; score = 0;
      newRound();
    };
    if (n === 3) burst();
  }

  newRound();
</script>

</body>
</html>
